[pytest]
# 超时保险（2026-10-13 新增）：单用例 120 秒未结束即失败，
# 避免后台线程/网络调用把套件挂成"无输出假死"。
addopts = --timeout=120 --timeout-method=thread

asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: 需要真实 PostgreSQL 的测试（PG 专有语法 / 真实数据），
                 本地 SQLite 环境会跳过。跑法：pytest -m integration
filterwarnings =
    ignore::DeprecationWarning
