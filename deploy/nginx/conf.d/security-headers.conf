# ── 统一安全响应头 ──
# 关键：nginx 中只要某个 location 内出现任意 add_header，就会**丢弃**上层 server 块的
# 全部 add_header（继承是"整体替换"而非"合并"）。因此安全头必须以 include 方式
# 在每个含 add_header 的 location 内重复声明，否则会静默失效。

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP：前端使用内联脚本/样式 + jsdelivr CDN 图表库，故允许 'unsafe-inline'。
# 作用是阻断恶意外域脚本与数据外发，不影响现有页面功能。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://alphareader.site; frame-ancestors 'none'" always;
